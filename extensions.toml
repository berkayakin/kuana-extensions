# The extensions Kuana's registry builds and serves: open-source extensions in Zed's format,
# each built from its author's repository at the commit given here (the version
# published in Zed's extension registry, which Zed reviewed).
#
# Only extensions with a clear license are listed (MIT, Apache-2.0). Add one with:
#
#   [<id>]
#   repository = "https://github.com/…"   its source
#   commit = "<full commit hash>"          what's built
#   license = "MIT"                        the extension's license (SPDX), checked by hand
#   path = "…"                             optional: the extension's folder in the repository


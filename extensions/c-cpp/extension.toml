id = "c-cpp"
name = "C and C++"
version = "0.1.0"
schema_version = 1
description = "C and C++: syntax highlighting, outline, folding and indentation, with clangd for completion, diagnostics, navigation and formatting."
authors = ["Berkay Akin"]
repository = "https://github.com/berkayakin/kuana-extensions"

[grammars.c]
repository = "https://github.com/tree-sitter/tree-sitter-c"
rev = "b780e47fc780ddc8da13afa35a3f4ed5c157823d"

[grammars.cpp]
repository = "https://github.com/tree-sitter/tree-sitter-cpp"
rev = "f41e1a044c8a84ea9fa8577fdd2eab92ec96de02"

[language_servers.clangd]
name = "clangd"
languages = ["C", "C++"]
command = "clangd"
install = "Install clangd: on macOS it comes with Xcode's command line tools (xcode-select --install); on Linux your distribution's clangd package (apt install clangd); or LLVM's release from clangd.llvm.org"

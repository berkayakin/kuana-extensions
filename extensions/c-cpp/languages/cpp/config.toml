name = "C++"
grammar = "cpp"
# Headers (.h) open as C++, as in Zed and clangd: C++'s grammar reads C too.
path_suffixes = ["cc", "cpp", "cxx", "c++", "cp", "cppm", "ixx", "h", "hh", "hpp", "hxx", "h++", "ipp", "inl", "tpp", "txx", "cu", "cuh", "ino"]
line_comments = ["// "]
block_comment = { start = "/*", prefix = " * ", end = "*/", tab_size = 1 }
tab_size = 4
language_id = "cpp"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "/*", end = " */", close = true, newline = false, not_in = ["string", "comment"] },
]
